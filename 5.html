<!DOCTYPE html>
<html>
<head>
    <title>Cricket Tournament Results</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin: auto;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: green;
            color: white;
        }

        .winner {
            color: red;
            font-size: 25px;
            font-weight: bold;
        }

        .winning-team {
            background-color: lightgreen;
            font-weight: bold;
        }

        h1 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <table>

        <tr>

        </tr>

        <tr>
            <td>2</td>

            <td>165</td>

        </tr>

        <tr>

        <tr>

        <tr>
            <td>8</td>

            <td>Eigth</td>
        </tr>

    </table>

</body>
</html>
