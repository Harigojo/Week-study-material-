<!DOCTYPE html>
<html>
<head>
    <title>Form Structured in Table</title>
</head>
<body>

    <h2>User Registration Form</h2>

    <!-- The form tag wraps around the entire table -->
    <form action="/submit-form-data" method="POST">
        <table border="0" cellpadding="8">
            
            <!-- Row 1: Name Field -->
            <tr>
                <td><label for="name">Full Name:</label></td>
                <td><input type="text" id="name" name="username"></td>
            </tr>

            <!-- Row 2: Email Field -->
            <tr>
                <td><label for="email">Email Address:</label></td>
                <td><input type="email" id="email" name="useremail"></td>
            </tr>

            <!-- Row 3: Submit Button -->
            <tr>
                <td></td>
                <td><input type="submit" value="Submit Info"></td>
            </tr>

        </table>
    </form>

</body>
</html>
