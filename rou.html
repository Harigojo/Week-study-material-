<!DOCTYPE html>
<html>
<head>
    <title>Cricket Tournament</title>

    <style>
        body {
            background-color: #eaf4ea;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: darkgreen;
        }

        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            box-shadow: 0px 5px 15px gray;
        }

        th {
            background-color: darkgreen;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border: 1px solid gray;
        }

        
        .india {
            background-color: #fff2a8;
            font-weight: bold;
        }

        .india:hover {
            background-color: #ffd54f;
        }

        .india .score {
            color: red;
            font-size: 25px;
        }

        
        .australia:hover {
            background-color: #b3e5fc;
        }

        
        .england:hover {
            background-color: #ffcdd2;
        }

        
        .pakistan:hover {
            background-color: #c8e6c9;
        }

        .result {
            color: darkgreen;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Cricket Tournament Results</h1>

    <table>

        <tr>
            <th>Team</th>
            <th>Score</th>
            <th>Result</th>
        </tr>

        <tr class="india">
            <td>India</td>
            <td class="score">180</td>
            <td class="result">Winner</td>
        </tr>

        <tr class="australia">
            <td>Australia</td>
            <td>165</td>
            <td>Runner-up</td>
        </tr>

        <tr class="england">
            <td>England</td>
            <td>155</td>
            <td>Third Place</td>
        </tr>

        <tr class="pakistan">
            <td>Pakistan</td>
            <td>145</td>
            <td>Fourth Place</td>
        </tr>

    </table>

</body>
</html>
